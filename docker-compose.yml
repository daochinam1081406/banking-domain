name: banking-domain

# Chạy end-to-end local: mssql (Accounts DB + backing store cho emulator) + postgres (Payments DB)
# → Azure Service Bus emulator → payments-api (publish qua Outbox) + accounts-api (consume).
# Không cần Azure subscription thật.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
    ports:
      - "1433:1433"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # host 5433 để tránh đụng D-Pro (deploy-postgres-1:5432)

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # host 6380 để tránh đụng D-Pro (deploy-redis-1:6379)

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - mssql
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
    ports:
      - "5672:5672"
    volumes:
      - ./deploy/servicebus-emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  payments-api:
    build:
      context: .
      dockerfile: src/Payments/Payments.Api/Dockerfile
    depends_on:
      - servicebus-emulator
      - postgres
      - accounts-api
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=payments;Username=postgres;Password=postgres"
      Grpc__AccountsUrl: "http://accounts-api:8090"
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ServiceBus__TopicName: "banking-events"
      ServiceBus__SubscriptionName: "payments-subscription"
    ports:
      - "8081:8080"

  accounts-api:
    build:
      context: .
      dockerfile: src/Accounts/Accounts.Api/Dockerfile
    depends_on:
      - servicebus-emulator
      - mssql
      - redis
    environment:
      ConnectionStrings__SqlServer: "Server=mssql,1433;Database=accounts;User Id=sa;Password=Str0ng!Passw0rd;TrustServerCertificate=true;"
      ConnectionStrings__Redis: "redis:6379"
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ServiceBus__TopicName: "banking-events"
      ServiceBus__SubscriptionName: "accounts-subscription"
    ports:
      - "8082:8080"
