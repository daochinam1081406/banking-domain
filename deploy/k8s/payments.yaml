apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: banking
spec:
  replicas: 2
  selector:
    matchLabels: { app: payments-api }
  template:
    metadata:
      labels: { app: payments-api }
    spec:
      containers:
        - name: payments-api
          image: <acr>.azurecr.io/banking-domain-payments-api:latest
          ports:
            - { name: rest, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: banking-config }
            - secretRef: { name: banking-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: payments-svc
  namespace: banking
spec:
  type: LoadBalancer     # entry point ngoài cho REST API
  selector: { app: payments-api }
  ports:
    - { name: rest, port: 80, targetPort: 8080 }
