apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-api
  namespace: banking
spec:
  replicas: 2
  selector:
    matchLabels: { app: insurance-api }
  template:
    metadata:
      labels: { app: insurance-api }
    spec:
      containers:
        - name: insurance-api
          image: <acr>.azurecr.io/banking-domain-insurance-api:latest
          ports:
            - { name: rest, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: banking-config }
            - secretRef: { name: banking-secrets }
          env:
            - name: ServiceBus__SubscriptionName
              value: "insurance-subscription"
          # readiness: kiểm tra phụ thuộc (DB/Redis). Trượt thì rút khỏi Service,
          # pod vẫn sống và tự quay lại khi phụ thuộc hồi phục.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # liveness: chỉ hỏi tiến trình còn phản hồi không — KHÔNG chạm database.
          # Nếu trỏ vào endpoint có kiểm tra DB, một sự cố DB tạm thời sẽ khiến K8s giết sạch pod
          # rồi lặp vô tận, biến sự cố nhỏ thành sập toàn hệ thống.
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          # startup: cho phép khởi động chậm (chạy migration) mà không bị liveness giết oan.
          startupProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: insurance-svc
  namespace: banking
spec:
  type: LoadBalancer
  selector: { app: insurance-api }
  ports:
    - { name: rest, port: 80, targetPort: 8080 }
---
# HPA: scale theo CPU — consumer group Kafka tự rebalance khi thêm pod,
# competing consumers của Service Bus cũng tự chia tải.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insurance-api-hpa
  namespace: banking
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: insurance-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
