apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-api
  namespace: banking
spec:
  replicas: 2
  selector:
    matchLabels: { app: insurance-api }
  template:
    metadata:
      labels: { app: insurance-api }
    spec:
      containers:
        - name: insurance-api
          image: <acr>.azurecr.io/banking-domain-insurance-api:latest
          ports:
            - { name: rest, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: banking-config }
            - secretRef: { name: banking-secrets }
          env:
            - name: ServiceBus__SubscriptionName
              value: "insurance-subscription"
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: insurance-svc
  namespace: banking
spec:
  type: LoadBalancer
  selector: { app: insurance-api }
  ports:
    - { name: rest, port: 80, targetPort: 8080 }
---
# HPA: scale theo CPU — consumer group Kafka tự rebalance khi thêm pod,
# competing consumers của Service Bus cũng tự chia tải.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insurance-api-hpa
  namespace: banking
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: insurance-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
