apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-config
  namespace: banking
data:
  Messaging__Provider: "ServiceBus"
  ServiceBus__TopicName: "banking-events"
  ServiceBus__SubscriptionName: "accounts-subscription"
  Grpc__AccountsUrl: "http://accounts-svc:8090"
---
# Secrets — production: dùng Azure Key Vault (CSI driver) thay vì commit giá trị thật.
# Ở đây để placeholder; connection string trỏ managed services (Azure SQL, Azure Cache for Redis,
# Azure Service Bus thật — không chạy DB/broker trong cluster).
apiVersion: v1
kind: Secret
metadata:
  name: banking-secrets
  namespace: banking
type: Opaque
stringData:
  ConnectionStrings__SqlServer: "Server=<azure-sql>;Database=accounts;User Id=<u>;Password=<REPLACE>;Encrypt=true;"
  ConnectionStrings__Postgres: "Host=<azure-pg>;Database=payments;Username=<u>;Password=<REPLACE>;SSL Mode=Require;"
  ConnectionStrings__Redis: "<azure-redis>:6380,password=<REPLACE>,ssl=True"
  ServiceBus__ConnectionString: "Endpoint=sb://<ns>.servicebus.windows.net/;SharedAccessKeyName=<k>;SharedAccessKey=<REPLACE>"
  Jwt__Secret: "<REPLACE-256bit-secret>"
  APPLICATIONINSIGHTS_CONNECTION_STRING: "<REPLACE-appinsights-conn>"
